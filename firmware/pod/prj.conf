# ---- Sensor and flash on SPI ----
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_PM_DEVICE=y
CONFIG_ADC=y
CONFIG_GPIO=y
CONFIG_FPU=y

# ---- No UART, USB or shell on this board: logs over SWD (RTT) for bring-up ----
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
# keep the whole boot log until a debugger reads it
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
# Generous stacks: an overflow on a sealed pod is a restart you can't debug. (The Bluetooth receive
# thread runs every GATT callback; its 1 KB default was the tightest.)
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_BT_RX_STACK_SIZE=2560
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=1536
CONFIG_MPSL_WORK_STACK_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536
CONFIG_ISR_STACK_SIZE=3072
CONFIG_IDLE_STACK_SIZE=512

# ---- Bluetooth: same service and name as the prototype ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="LiftPod"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
# Big packets for downloading recordings (16 samples per notification)
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y

# ---- Firmware updates over Bluetooth (MCUboot + MCUmgr SMP) ----
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_REBOOT=y
# restart by itself if the firmware ever hangs (fed once a second from the main loop)
CONFIG_WATCHDOG=y
# why it last restarted, reported to the app
CONFIG_HWINFO=y
# the flash driver otherwise spins at full speed while an erase runs, starving everything else
CONFIG_SPI_NOR_SLEEP_WHILE_WAITING_UNTIL_READY=y
