# ---- IMU: LSM6DS3TR-C (uses Zephyr's LSM6DSL driver) ----
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_TRIGGER_NONE=y
# 208 Hz output data rate for both sensors (the logger samples at 100 Hz)
CONFIG_LSM6DSL_ACCEL_ODR=5
CONFIG_LSM6DSL_GYRO_ODR=5
# +/-8 g and +/-1000 deg/s: headroom for fast reps without clipping
CONFIG_LSM6DSL_ACCEL_FS=8
CONFIG_LSM6DSL_GYRO_FS=1000

# ---- 2 MB external QSPI flash for recordings ----
CONFIG_FLASH=y

# ---- LEDs ----
CONFIG_GPIO=y

# ---- Shell + logs over the USB serial port ----
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048
# Plain text output so the laptop script can parse it
CONFIG_SHELL_VT100_COLORS=n
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Lift Tracker Logger"

# ---- rec dfu: reboot into the UF2 bootloader ----
CONFIG_REBOOT=y

# ---- battery voltage (rec batt) ----
CONFIG_ADC=y

# ---- Bluetooth LE link to the phone app (src/ble.c) ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="LiftPod"
CONFIG_BT_MAX_CONN=1
# Ask the phone for a 15-30 ms connection interval: the live stream is 25 Hz
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
