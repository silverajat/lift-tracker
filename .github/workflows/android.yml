name: Android app

on:
  push:
    branches: [main]
    paths: ['app/android/**', '.github/workflows/android.yml', 'python/repcount/**']
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a release

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # Robolectric downloads a ~150 MB Android jar from Maven Central on every run, and Central
      # rate-limits (HTTP 429): keep it in the cache and retry the tests if the first fetch is refused.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-15
      - name: Unit tests (rep counter vs the Python reference)
        run: |
          gradle testDebugUnitTest --no-daemon --stacktrace -i | grep -E "MISMATCH|exact|ROM|PODV2|FAILED|PASSED|Tests" || true
          for i in 1 2 3; do gradle testDebugUnitTest --no-daemon && exit 0; echo "retry $i in 60 s"; sleep 60; done
          exit 1
      - name: Screenshots (sample data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: app/android/app/build/outputs/roborazzi/
          if-no-files-found: ignore
      - name: Publish screenshots as the "screens-latest" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls app/build/outputs/roborazzi/*.png >/dev/null 2>&1 || exit 0
          gh release delete screens-latest --yes --cleanup-tag || true
          gh release create screens-latest app/build/outputs/roborazzi/*.png \
            --title "App screenshots (sample data)" --notes "Built from ${GITHUB_SHA::7}" --prerelease
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk spotter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: spotter-apk
          path: app/android/spotter.apk
      - name: Publish as the "app-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest spotter.apk \
            --title "Spotter app (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone: download spotter.apk, open it, allow installing from this source." \
            --prerelease
